<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2735" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)" opacity="0.5"/>

  <!-- circuit-style ledger lines, evoking transaction/data flow -->
  <g stroke="#22384a" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 0 60 H 180 L 210 90 H 1200"/>
    <path d="M 0 220 H 260 L 290 190 H 1200"/>
    <path d="M 1000 0 V 60"/>
    <path d="M 90 0 V 40"/>
    <path d="M 1120 280 V 220"/>
  </g>
  <g fill="#c9a24b">
    <circle cx="210" cy="90" r="3.5"/>
    <circle cx="290" cy="190" r="3.5"/>
    <circle cx="1000" cy="60" r="3.5"/>
  </g>

  <rect x="0" y="0" width="6" height="280" fill="url(#accent)"/>

  <text x="80" y="128" font-family="'JetBrains Mono','Courier New',monospace" font-size="54" font-weight="700" fill="#eef2f6" letter-spacing="2">AYUB MIAZE</text>
  <text x="80" y="164" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" fill="#7d93a8" letter-spacing="1">SOFTWARE ENGINEER — ORACLE APEX &amp; PL/SQL ARCHITECT</text>

  <rect x="80" y="188" width="46" height="2" fill="url(#accent)"/>

  <text x="80" y="216" font-family="'JetBrains Mono','Courier New',monospace" font-size="15" fill="#5b7186" letter-spacing="0.5">Enterprise Banking &amp; Agent Banking Systems · Dhaka, Bangladesh</text>

  <text x="1120" y="256" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#3d4f5f" letter-spacing="1">EST. IN PRODUCTION CODE</text>
</svg>
